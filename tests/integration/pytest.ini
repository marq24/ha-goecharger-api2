[pytest]
asyncio_mode = auto
pythonpath = ../..
markers =
    known_bug(description): the test describes a bug that is not fixed yet; it fails on purpose. Deselect with -m "not known_bug".
    needs_decision(description): documentation and code differ; it is not yet decided whether this is intended or a documentation gap. Fails on purpose, not blocking. Deselect with -m "not needs_decision".
