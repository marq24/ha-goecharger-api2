name: Publish test results (GitHub Pages)

# Builds the site from the latest results and publishes it with GitHub Pages:
# - the summary of the latest run of "Regression tests on new upstream release"
# - the full test report of the latest run of "Test report (manual)" (with the coverage in detail)
# - the list of all test cases (built from the current tests and the junit file of that report)
# - the arc42 document and the test concept from docs/quality as web pages (Mermaid diagrams included)
# Starts after one of those two workflows has finished, or by hand. Needs Pages with the source
# "GitHub Actions" in the settings of the fork.

on:
  workflow_run:
    workflows: ["Regression tests on new upstream release", "Test report (manual)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Download the latest results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/report results/regression
          fetch() {  # <workflow file> <artifact prefix> <target dir>
            run="$(gh run list --workflow "$1" --status completed --limit 20 --json databaseId,conclusion \
                   --jq '[.[] | select(.conclusion=="success" or .conclusion=="failure")][0].databaseId')"
            [ -n "$run" ] && gh run download "$run" --pattern "$2*" --dir "$3" || echo "no results for $1"
          }
          fetch test-report.yaml testreport- results/report
          fetch regression-on-release.yaml regression- results/regression

      - name: Build the site
        run: |
          pip install markdown
          report="$(ls -d results/report/testreport-* 2>/dev/null | head -1)"
          summary="$(ls results/regression/regression-*/summary.md 2>/dev/null | head -1)"
          args=""
          if [ -n "$report" ]; then
            python tests/tools/build_testcases.py "$report/junit-all.xml" tests/integration testcases.md
            args="--report $report --testcases testcases.md"
          fi
          [ -n "$summary" ] && args="$args --regression $summary"
          python tests/tools/build_site.py _site --docs docs/quality $args

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
