name: Tests

# Runs the regression tests of tests/integration. Tests marked known_bug or needs_decision describe
# findings that are still open: they run in a second, non-blocking step and are listed in the job summary.
# Manual full report (coverage): test-report.yaml.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements_dev.txt"
      - "docs/architecture/**"
      - "docs/quality/**"
      - ".github/workflows/tests.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements_dev.txt"
      - "docs/architecture/**"
      - "docs/quality/**"
      - ".github/workflows/tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_dev.txt msgpack
          python -m pip show homeassistant pytest-homeassistant-custom-component | grep -E "^(Name|Version)"

      - name: Risk documents match their front matter
        run: python tests/tools/build_risk_register.py --check

      - name: Blocking tests
        run: python -m pytest tests/integration -p no:cacheprovider -q -m "not known_bug and not needs_decision"

      - name: Open findings (known_bug, needs_decision)
        continue-on-error: true
        run: |
          python -m pytest tests/integration -p no:cacheprovider -q -m "known_bug or needs_decision" | tee open-findings.txt
          { echo "### Open findings"; echo; echo '```'; tail -n 40 open-findings.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
