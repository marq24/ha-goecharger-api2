blueprint:
  name: go-eCharger PV Surplus Charging
  description: |
    Flexible blueprint for transmitting solar system data to go-eCharger for PV surplus charging.

    **Requirements:** This blueprint requires the go-eCharger API2 integration from
    [marq24/ha-goecharger-api2](https://github.com/marq24/ha-goecharger-api2)

    **Data Transmission:**
    - Daylight (sunrise to sunset), car connected: real PV data every 5 seconds (required by go-eCharger).
    - Night, car connected: zero values every 30 seconds.
    - At sunset: one immediate zero push, even if no car is connected.

    The zero values keep the go-eCharger from working with stale `pvopt_*` averages. The
    charger calculates these averages from the last values it has received, no matter how
    old they are. Without the zero values, a car that is (re)connected at night can start
    charging at sunrise on the basis of yesterday's surplus.

    **Units:** The go-eCharger expects watts. If your entities report kW, set the
    *Power Unit Multiplier* to 1000. If they report W, keep the default of 1. The factor is
    applied to the grid, PV and battery values.

    **Configuration Sections:** The input fields are organized into three grid power measurement methods:
    - Single Entity: Use one entity with positive/negative values
    - Consumption + Feed-in: Use separate entities for grid consumption and feed-in
    - 3-Phase Entities: Use individual entities for L1, L2, L3 phases

    Choose only ONE grid method that matches your inverter's entity structure.
  domain: automation
  author: OliEder
  homeassistant:
    min_version: 2024.6.0
  input:
    car_connected:
      name: Car connected Entity
      description: Entity from go-eCharger API2 integration that indicates the vehicle connection status
      input:
        car_connected_entity:
          name: Car connected
          description: Entity from go-eCharger API2 integration that indicates the vehicle connection status
          selector:
            target:
              entity:
                - integration: goecharger_api2
                  domain: binary_sensor

    power_multiplier:
      name: Power Unit Multiplier
      description: >
        Factor applied to all power values (grid, PV and battery) before they are sent to
        the go-eCharger, which expects watts. Use 1 if your entities report W (default),
        1000 if they report kW.
      default: 1
      selector:
        number:
          min: 0.001
          max: 1000000
          step: any
          mode: box

    grid_single:
      name: Grid Power - Single Entity
      description: Use ONE entity with positive (import) and negative (export) values
      collapsed: true
      input:
        grid_single_entity:
          name: Grid Power Entity
          description: Entity with +/- values (positive = import, negative = export)
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        grid_single_invert:
          name: Invert Values
          description: Enable if positive means export instead of import
          default: false
          selector:
            boolean:

    grid_dual:
      name: Grid Power - Consumption + Feed-in
      description: Use separate entities for grid consumption and feed-in (both always positive)
      collapsed: true
      input:
        grid_consumption_entity:
          name: Grid Consumption Entity
          description: Grid consumption (always positive)
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        grid_feedin_entity:
          name: Grid Feed-in Entity
          description: Grid feed-in (always positive)
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power

    grid_phases:
      name: Grid Power - 3-Phase Entities
      description: Use individual entities for each phase (L1, L2, L3) - all three will be summed
      collapsed: true
      input:
        grid_phase_entities:
          name: Grid Phase Entities (L1, L2, L3)
          description: Select exactly 3 entities for phases L1, L2, L3
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: power
        grid_phases_invert:
          name: Invert Phase Values
          description: Enable if positive means export instead of import
          default: false
          selector:
            boolean:

    pv_entities:
      name: PV Power Entities
      description: One or more PV entities (required)
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: power

    pv_invert:
      name: Invert PV Power Values
      description: Enable if PV entities use negative values for generation
      default: false
      selector:
        boolean:

    battery_enabled:
      name: Enable Battery Data Transmission
      description: Send battery data to go-eCharger
      default: true
      selector:
        boolean:

    battery_entities:
      name: Battery Power Entities
      description: One or more battery entities (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: power

    battery_invert:
      name: Invert Battery Power Values
      description: Enable if positive values mean charging instead of discharging
      default: false
      selector:
        boolean:

variables:
  car_connected_entity: !input car_connected_entity
  multiplier: !input power_multiplier
  grid_single_entity: !input grid_single_entity
  grid_single_invert: !input grid_single_invert
  grid_consumption: !input grid_consumption_entity
  grid_feedin: !input grid_feedin_entity
  grid_phases: !input grid_phase_entities
  grid_phases_invert: !input grid_phases_invert
  pv_list: !input pv_entities
  pv_invert_flag: !input pv_invert
  battery_enable: !input battery_enabled
  battery_list: !input battery_entities
  battery_invert_flag: !input battery_invert

  pgrid_value: >
    {% if grid_single_entity %}
      {% set value = states(grid_single_entity) | float(0) %}
      {{ (value * -1) if grid_single_invert else value }}
    {% elif grid_consumption and grid_feedin %}
      {% set cons_val = states(grid_consumption) | float(0) %}
      {% set feed_val = states(grid_feedin) | float(0) %}
      {{ cons_val - feed_val }}
    {% elif grid_phases | length >= 3 %}
      {% set ns = namespace(total=0) %}
      {% for entity in grid_phases[:3] %}
        {% set ns.total = ns.total + (states(entity) | float(0)) %}
      {% endfor %}
      {{ (ns.total * -1) if grid_phases_invert else ns.total }}
    {% else %}
      0
    {% endif %}

  ppv_value: >
    {% set ns = namespace(total=0) %}
    {% for entity in pv_list %}
      {% set ns.total = ns.total + (states(entity) | float(0)) %}
    {% endfor %}
    {{ (ns.total * -1) if pv_invert_flag else ns.total }}

  pakku_value: >
    {% if battery_enable %}
      {% set ns = namespace(total=0) %}
      {% for entity in battery_list %}
        {% set ns.total = ns.total + (states(entity) | float(0)) %}
      {% endfor %}
      {{ (ns.total * -1) if battery_invert_flag else ns.total }}
    {% else %}
      0
    {% endif %}

triggers:
  - trigger: time_pattern
    seconds: /5
    id: tick
  - trigger: sun
    event: sunset
    id: sunset

actions:
  - choose:
      # Daylight, car connected: real data every 5 seconds
      - conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: '{{ expand(car_connected_entity.entity_id) | selectattr("state", "eq", "on") | list | count > 0 }}'
          - condition: sun
            after: sunrise
          - condition: sun
            before: sunset
        sequence:
          - action: goecharger_api2.set_pv_data
            data:
              pgrid: '{{ ((pgrid_value | float(0)) * (multiplier | float(1))) | round(0) | int }}'
              ppv: '{{ ((ppv_value | float(0)) * (multiplier | float(1))) | round(0) | int }}'
              pakku: '{{ ((pakku_value | float(0)) * (multiplier | float(1))) | round(0) | int }}'

      # Night, car connected: zeros every 30 seconds (flushes stale averages)
      - conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: '{{ expand(car_connected_entity.entity_id) | selectattr("state", "eq", "on") | list | count > 0 }}'
          - condition: not
            conditions:
              - condition: and
                conditions:
                  - condition: sun
                    after: sunrise
                  - condition: sun
                    before: sunset
          - condition: template
            value_template: '{{ now().second % 30 < 5 }}'
        sequence:
          - action: goecharger_api2.set_pv_data
            data:
              pgrid: 0
              ppv: 0
              pakku: 0

      # Sunset: one immediate zero push, regardless of car connection
      - conditions:
          - condition: trigger
            id: sunset
        sequence:
          - action: goecharger_api2.set_pv_data
            data:
              pgrid: 0
              ppv: 0
              pakku: 0

mode: single